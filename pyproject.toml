[project]
name = "fk-ai-slop"
version = "0.1.0"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0",
    "playwright>=1.65.2",
    "pyyaml>=6.0.4",
    "sqlite-vec>=0.1.9",
    "trafilatura>=2.4.0",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2026.11.23",
]

[project.scripts]
fk = "fkslop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fkslop"]
